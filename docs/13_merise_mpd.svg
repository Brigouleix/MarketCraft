    <!-- lignes_commande → produits -->
    <line x1="1085" y1="700" x2="1179" y2="598" marker-end="url(#refArrow)"/>
    <!-- paiements → commandes -->
    <line x1="345" y1="930" x2="499" y2="813" marker-end="url(#refArrow)"/>
    <!-- avis → produits -->
    <line x1="1300" y1="780" x2="1300" y2="598" marker-end="url(#refArrow)"/>
    <!-- avis → utilisateurs -->
    <polyline points="1160,860 30,860 30,150 58,150" marker-end="url(#refArrow)"/>
    <!-- produit_categorie → produits -->
    <line x1="1000" y1="136" x2="1178" y2="328" marker-end="url(#refArrow)"/>
    <!-- produit_categorie → categories -->
    <line x1="1140" y1="100" x2="1158" y2="100" marker-end="url(#refArrow)"/>
  </g>

