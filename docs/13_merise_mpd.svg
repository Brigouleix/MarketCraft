  <!-- ══════════════ ENCART COMPOSANTS SGBD ══════════════ -->
  <g>
    <path d="M430,900 L1015,900 L1030,915 L1030,1005 L430,1005 Z" fill="#ffffe0" stroke="#b0a860" stroke-width="1"/>
    <path d="M1015,900 L1015,915 L1030,915" fill="none" stroke="#b0a860" stroke-width="1"/>
    <text x="440" y="916" font-size="11.5" font-weight="bold">Composants SGBD (CP8)</text>
    <g font-size="10.5">
      <text x="440" y="933">Triggers : trg_avis_after_insert / _update / _delete → recalcul de note_moyenne et nombre_avis (produits)</text>
      <text x="440" y="948">Trigger : trg_produits_after_update_note → répercute la note moyenne des produits sur boutiques</text>
      <text x="440" y="963">Fonction : fn_stock_suffisant(produit_id, quantite) → contrôle du stock avant ligne de commande</text>
      <text x="440" y="978">Procédure : sp_liberer_paiements_echus() → passe les paiements à « libere » à J+14 après livraison</text>
      <text x="440" y="993">Event : evt_liberation_paiements_quotidien → exécute la procédure chaque jour</text>
    </g>
  </g>
</svg>
