<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 930" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <linearGradient id="assocGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4fd"/>
      <stop offset="1" stop-color="#c9c9ee"/>
    </linearGradient>
  </defs>

  <!-- Fond blanc -->
  <rect x="0" y="0" width="1260" height="930" fill="#ffffff"/>

  <text x="630" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#000">
    Modèle Conceptuel de Données (Merise) — MarketCraft
  </text>

  <!-- ══════════════ LIENS + CARDINALITÉS ══════════════ -->
  <g stroke="#9090c0" stroke-width="1.2">
    <!-- UTILISATEUR ─ gérer ─ BOUTIQUE -->
    <line x1="335" y1="105" x2="365" y2="105"/>
    <line x1="455" y1="105" x2="520" y2="105"/>
    <!-- BOUTIQUE ─ proposer ─ PRODUIT -->
    <line x1="700" y1="176" x2="790" y2="200"/>
    <line x1="865" y1="222" x2="920" y2="330"/>
    <!-- CATEGORIE ─ classer ─ PRODUIT -->
    <line x1="1090" y1="143" x2="1080" y2="225"/>
    <line x1="1075" y1="255" x2="1040" y2="330"/>
    <!-- UTILISATEUR ─ évaluer ─ PRODUIT -->
    <line x1="335" y1="180" x2="445" y2="315"/>
    <line x1="675" y1="330" x2="880" y2="385"/>
    <!-- UTILISATEUR ─ passer ─ COMMANDE -->
    <line x1="175" y1="213" x2="175" y2="465"/>
    <line x1="210" y1="492" x2="350" y2="560"/>
    <!-- COMMANDE ─ concerner ─ PRODUIT -->
    <line x1="605" y1="596" x2="645" y2="592"/>
    <line x1="875" y1="585" x2="1000" y2="488"/>
    <!-- COMMANDE ─ régler ─ PAIEMENT -->
    <line x1="400" y1="673" x2="340" y2="725"/>
    <line x1="285" y1="748" x2="200" y2="780"/>
    <!-- COMMANDE ─ livrer ─ ADRESSE_LIVRAISON -->
    <line x1="505" y1="673" x2="552" y2="705"/>
    <line x1="600" y1="730" x2="680" y2="760"/>
  </g>

  <g font-size="11" fill="#000">
    <text x="340" y="99">0,1</text>
    <text x="492" y="99">1,1</text>
    <text x="706" y="195">1,n</text>
    <text x="898" y="322">1,1</text>
    <text x="1098" y="172">0,n</text>
    <text x="1048" y="316">0,n</text>
    <text x="352" y="194">0,n</text>
    <text x="850" y="378">0,n</text>
    <text x="182" y="242">0,n</text>
    <text x="326" y="549">1,1</text>
    <text x="613" y="588">1,n</text>
    <text x="968" y="507">0,n</text>
    <text x="386" y="702">1,1</text>
    <text x="228" y="768">1,1</text>
    <text x="510" y="696">1,1</text>
    <text x="636" y="752">0,n</text>
  </g>

