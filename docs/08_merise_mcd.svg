      <text x="628" y="806">ligne1</text><text x="735" y="806">Caractère variable (255) &lt;O&gt;</text>
      <text x="628" y="821">ville</text><text x="735" y="821">Caractère variable (100) &lt;O&gt;</text>
      <text x="628" y="836">code_postal</text><text x="735" y="836">Caractère variable (10) &lt;O&gt;</text>
      <text x="628" y="851">pays</text><text x="735" y="851">Caractère variable (50) &lt;O&gt;</text>
    </g>
    <line x1="620" y1="856" x2="905" y2="856" stroke="#00b3b3" stroke-width="1"/>
    <text x="628" y="869" font-size="11">Identifiant_1 &lt;pi&gt;</text>
  </g>

  <!-- ══════════════ ASSOCIATIONS ══════════════ -->
  <g stroke="#8f8fc4" stroke-width="1.2" fill="url(#assocGrad)">
    <rect x="365" y="90"  width="90"  height="30" rx="15"/>
    <rect x="765" y="200" width="100" height="30" rx="15"/>
    <rect x="1035" y="225" width="90" height="30" rx="15"/>
    <rect x="130" y="465" width="90"  height="30" rx="15"/>
    <rect x="285" y="725" width="90"  height="30" rx="15"/>
    <rect x="515" y="705" width="90"  height="30" rx="15"/>
    <!-- associations porteuses d'attributs -->
    <rect x="445" y="291" width="230" height="78" rx="22"/>
    <rect x="645" y="558" width="230" height="63" rx="20"/>
  </g>

  <g font-size="12" fill="#000" text-anchor="middle">
    <text x="410" y="109">gérer</text>
    <text x="815" y="219">proposer</text>
    <text x="1080" y="244">classer</text>
    <text x="175" y="484">passer</text>
    <text x="330" y="744">régler</text>
    <text x="560" y="724">livrer</text>
    <text x="560" y="308">évaluer</text>
    <text x="760" y="575">concerner</text>
  </g>

  <!-- attributs de l'association évaluer -->
  <line x1="460" y1="313" x2="660" y2="313" stroke="#8f8fc4" stroke-width="1"/>
  <g font-size="11" fill="#000">
    <text x="465" y="326">note</text><text x="570" y="326">Entier</text>
    <text x="465" y="341">commentaire</text><text x="570" y="341">Texte (256)</text>
    <text x="465" y="356">date_avis</text><text x="570" y="356">Date système</text>
  </g>

  <!-- attributs de l'association concerner -->
  <line x1="660" y1="580" x2="860" y2="580" stroke="#8f8fc4" stroke-width="1"/>
  <g font-size="11" fill="#000">
    <text x="665" y="593">quantite</text><text x="770" y="593">Entier</text>
    <text x="665" y="608">prix_unitaire</text><text x="770" y="608">Décimal (10,2)</text>
  </g>
