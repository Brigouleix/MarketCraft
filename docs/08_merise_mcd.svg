      <text x="592" y="79" font-size="10">&#160;&lt;pi&gt;</text>
      <text x="645" y="79" text-decoration="underline">Entier &lt;O&gt;</text>
      <text x="528" y="94">nom_boutique</text><text x="645" y="94">Caractère variable (100) &lt;O&gt;</text>
      <text x="528" y="109">description</text><text x="645" y="109">Texte (500)</text>
      <text x="528" y="124">logo</text><text x="645" y="124">Image</text>
      <text x="528" y="139">statut</text><text x="645" y="139">Caractère variable (20) &lt;O&gt;</text>
      <text x="528" y="154">date_creation</text><text x="645" y="154">Date système</text>
