    <line x1="40" y1="88" x2="335" y2="88" stroke="#00b3b3" stroke-width="1"/>
    <text x="187" y="83" text-anchor="middle" font-size="12">UTILISATEUR</text>
    <g font-size="11">
      <text x="48" y="101" text-decoration="underline">id_utilisateur</text>
      <text x="122" y="101" font-size="10">&#160;&lt;pi&gt;</text>
      <text x="168" y="101" text-decoration="underline">Entier &lt;O&gt;</text>
      <text x="48" y="116">nom</text><text x="168" y="116">Caractère variable (50) &lt;O&gt;</text>
      <text x="48" y="131">prenom</text><text x="168" y="131">Caractère variable (50)</text>
      <text x="48" y="146">email</text><text x="168" y="146">Caractère variable (100) &lt;O&gt;</text>
      <text x="48" y="161">mot_de_passe</text><text x="168" y="161">Caractère variable (255) &lt;O&gt;</text>
      <text x="48" y="176">role</text><text x="168" y="176">Caractère variable (20) &lt;O&gt;</text>
      <text x="48" y="191">date_inscription</text><text x="168" y="191">Date système</text>
    </g>
    <line x1="40" y1="196" x2="335" y2="196" stroke="#00b3b3" stroke-width="1"/>
    <text x="48" y="209" font-size="11">Identifiant_1 &lt;pi&gt;</text>
  </g>

