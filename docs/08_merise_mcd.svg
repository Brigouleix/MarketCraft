      <text x="328" y="621">statut</text><text x="445" y="621">Caractère variable (20) &lt;O&gt;</text>
      <text x="328" y="636">total</text><text x="445" y="636">Décimal (10,2) &lt;O&gt;</text>
      <text x="328" y="651">date_commande</text><text x="445" y="651">Date système &lt;O&gt;</text>
