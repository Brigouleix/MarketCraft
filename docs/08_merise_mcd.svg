      <text x="68" y="856">statut</text><text x="185" y="856">Caractère variable (20) &lt;O&gt;</text>
      <text x="68" y="871">date_paiement</text><text x="185" y="871">Date système</text>
    </g>
    <line x1="60" y1="876" x2="345" y2="876" stroke="#00b3b3" stroke-width="1"/>
    <text x="68" y="889" font-size="11">Identifiant_1 &lt;pi&gt;</text>
  </g>

  <!-- ══════════════ ENTITÉ ADRESSE_LIVRAISON ══════════════ -->
  <g>
    <rect x="620" y="760" width="285" height="113" fill="#ccffff" stroke="#00b3b3" stroke-width="1.2"/>
    <line x1="620" y1="778" x2="905" y2="778" stroke="#00b3b3" stroke-width="1"/>
    <text x="762" y="773" text-anchor="middle" font-size="12">ADRESSE_LIVRAISON</text>
    <g font-size="11">
